services:
  frontend:
    container_name: kari-frontend
    build:
      context: .
      dockerfile: .docker/frontend/Dockerfile
    ports:
      - "3000:3000"
    environment:
      # ブラウザから叩くURL（ホスト側のポートマッピング経由）
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      # Route Handlerはコンテナ内で動くため、backendへはサービス名で到達する
      - API_URL=http://backend:8000
      - X_API_KEY=${X_API_KEY}
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - backend
    networks:
      - kari-net

  backend:
    container_name: kari-backend
    build:
      context: .
      dockerfile: .docker/backend/Dockerfile
    ports:
      - "8000:8000"
    environment:
      - DEBUG=${DEBUG:-true}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-["http://localhost:3000","http://127.0.0.1:3000","http://localhost:8000","http://127.0.0.1:8000"]}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - X_API_KEY=${X_API_KEY}
      - RATE_LIMIT_PER_MINUTE=${RATE_LIMIT_PER_MINUTE:-10}
      - RATE_LIMIT_SESSION_MAX=${RATE_LIMIT_SESSION_MAX:-30}
    volumes:
      - ./backend:/app
    networks:
      - kari-net

networks:
  kari-net:
    driver: bridge
